name: cv_scan_workspace
publish_to: none

environment:
  sdk: ^3.12.2

workspace:
  - app
  - packages/core
  - packages/domain
  - packages/data
  - packages/features/candidates_list
  - packages/features/candidate_detail

dev_dependencies:
  melos: ^7.8.2

melos:
  scripts:
    analyze:
      run: melos exec -- flutter analyze
      description: Run flutter analyze on all packages

    test:
      run: melos exec -- flutter test
      description: Run tests on all packages

    build:
      run: melos exec -- dart run build_runner build --delete-conflicting-outputs
      description: Run codegen on all packages

