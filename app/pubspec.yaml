name: cv_scan_app
description: CV-Scan Mobile — offline-first HR screening app
publish_to: none
version: 1.0.0+1
resolution: workspace

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cv_scan_core:
    path: ../packages/core
  cv_scan_domain:
    path: ../packages/domain
  cv_scan_data:
    path: ../packages/data
  shared:
    path: ../packages/features/shared
  feature_auth:
    path: ../packages/features/auth
  feature_candidates_list:
    path: ../packages/features/candidates_list
  feature_candidate_detail:
    path: ../packages/features/candidate_detail
  flutter_bloc: ^9.1.0
  bloc_concurrency: ^0.3.0
  go_router: ^17.3.0
  get_it: ^9.2.1
  injectable: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  injectable_generator: ^3.1.0

flutter:
  uses-material-design: true
  assets:
    - ../meta/mock/candidates.json
    - ../meta/mock/candidates-large.json
