name: cv_scan_ui_kit
description: UI foundation — theme, routing, localization, shared design system
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cv_scan_core:
    path: ../core
  intl: any
  collection: any
  go_router: ^17.3.0
  google_fonts: ^8.1.0
  theme_tailor_annotation: ^3.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  theme_tailor: ^3.1.3
  intl_utils: 2.8.14
  build_runner: ^2.15.0

flutter:
  generate: true

flutter_intl:
  enabled: true # Required. Must be set to true to activate the plugin. Default: false
  class_name: Translations # Optional. Sets the name for the generated localization class. Default: S
  main_locale: ru # Optional. Sets the main locale used for generating localization files. Provided value should consist of language code and optional script and country codes separated with underscore (e.g. 'en', 'en_GB', 'zh_Hans', 'zh_Hans_CN'). Default: en
  arb_dir: lib/src/localization # Optional. Sets the directory of your ARB resource files. Provided value should be a valid path on your system. Default: lib/l10n
  output_dir: lib/src/generated/l10n # Optional. Sets the directory of generated localization files. Provided value should be a valid path on your system. Default: lib/generated
  use_deferred_loading: false # Optional. Must be set to true to generate localization code that is loaded with deferred loading. Default: false
