name: CI

on:
  pull_request:
    branches: [dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.2
          channel: stable
          cache: true

      - name: Activate Melos
        run: dart pub global activate melos 7.8.1

      - name: Resolve dependencies
        run: melos run get

      - name: Analyze
        run: melos run analyze

      - name: Test
        run: melos run test
